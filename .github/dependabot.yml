# Dependabot (plan 8.2 A06): GitHub checks our dependencies every week and opens a pull request
# when a newer or patched version is out. Security fixes are opened right away.
version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule: { interval: weekly }
    groups: # one PR for all minor/patch bumps instead of one per package
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /client
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
# The postgres:17 image is left out on purpose: a major PostgreSQL bump can't reuse the existing
# data folder (it needs pg_upgrade), so that upgrade should be a deliberate, manual step.
